<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RENKA · Log</title>
<!-- The Log: bugs, feature requests and notes from quote builder users.
     Entries are saved by the accounts back end (renka-portal.pages.dev) and
     copied every 15 minutes to github.com/MerlinsGroup/renka-portal-log
     (portal-log.txt). Uses the sign-in from index.html (same browser tab). -->
<style>
:root{--ink:#141618;--soft:#212223;--greige:#979487;--paper:#f0f0f1;--line:#e2e2e0}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--soft);font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.top{background:#fff;border-bottom:1px solid var(--line)}
.top__in{max-width:820px;margin:0 auto;padding:0 28px;height:64px;display:flex;align-items:center;gap:18px}
.mark{font-size:21px;font-weight:700;letter-spacing:-.025em;color:var(--ink);line-height:1}
.ctx{font-size:10.5px;letter-spacing:.185em;text-transform:uppercase;color:var(--greige)}
.top a{margin-left:auto;font-size:13px;color:var(--greige);text-decoration:none}
.top a:hover{color:var(--ink)}
main{max-width:820px;margin:0 auto;padding:36px 28px 80px}
@media (max-width:640px){.top__in,main{padding-left:16px;padding-right:16px}}
h1{margin:0 0 4px;font-size:27px;font-weight:300;letter-spacing:-.02em;color:var(--ink)}
.lede{margin:0 0 24px;color:var(--greige);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:3px;padding:22px 24px;margin-bottom:30px}
.row{display:grid;grid-template-columns:200px 1fr;gap:16px}
@media (max-width:640px){.row{grid-template-columns:1fr}}
label{display:block;margin-bottom:16px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--greige)}
select,textarea{display:block;width:100%;margin-top:6px;font:inherit;font-size:14px;color:var(--ink);padding:9px 11px;border:1px solid var(--line);border-radius:2px;background:#fff;text-transform:none;letter-spacing:normal}
textarea{min-height:120px;resize:vertical;line-height:1.5}
select:focus,textarea:focus{border-color:var(--ink);outline:none}
button{appearance:none;font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--ink);border-radius:2px;background:var(--ink);color:#fff;padding:11px 22px}
button:disabled{opacity:.4;cursor:wait}
.err{margin:0 0 16px;font-size:13px;color:var(--ink);border-left:2px solid var(--ink);padding:7px 0 7px 12px;background:#e9e8e4}
.ok{margin:12px 0 0;font-size:13px;color:var(--greige)}
.listhead{display:flex;align-items:end;gap:16px;margin:0 0 12px}
.listhead h2{margin:0 0 8px;font-size:12px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--greige)}
.listhead label{margin:0 0 0 auto;width:180px}
.entry{background:#fff;border:1px solid var(--line);border-radius:3px;padding:14px 18px;margin-bottom:10px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--greige);margin-bottom:6px}
.pill{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#fff;background:#6b6a63;padding:2px 8px;border-radius:2px}
.pill--Bug{background:#9b2c2c}.pill--Feature{background:#2c5d9b}.pill--Improvement{background:#2f7d55}.pill--Question{background:#8a6d1f}
.text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.empty{color:var(--greige);font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="top__in">
  <span class="mark">renka</span><span class="ctx">Log</span>
  <a href="./">&larr; Back to the quote builder</a>
</div></header>
<main>
  <h1>Log</h1>
  <p class="lede">Report a bug, ask for a feature or leave a note. Everyone with access to the quote builder can see the log.</p>
  <form class="card" id="f" novalidate>
    <p class="err" id="err" hidden></p>
    <div class="row">
      <label>Type<select id="type">
        <option>Bug</option><option>Feature request</option><option>Improvement</option><option>Question</option><option>Other</option>
      </select></label>
      <label>Details<textarea id="text" maxlength="4000" placeholder="What happened, or what would you like? For a bug, say what you clicked and what you expected." required></textarea></label>
    </div>
    <button type="submit">Add to log</button>
    <p class="ok" id="ok" hidden>Added. Thank you.</p>
  </form>
  <div class="listhead"><h2>Entries</h2>
    <label>Show<select id="filter">
      <option value="">All types</option><option>Bug</option><option>Feature request</option><option>Improvement</option><option>Question</option><option>Other</option>
    </select></label>
  </div>
  <div id="list"><p class="empty">Loading...</p></div>
</main>
<script>
const AUTH_API = /(^|\.)renka-portal\.pages\.dev$/.test(location.hostname) ? '' : 'https://renka-portal.pages.dev';
const $ = s => document.querySelector(s);
let token = ''; try { token = sessionStorage.getItem('renka.session') || ''; } catch (e) { }
if (!token) location.replace('./');
let all = [];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fmt = iso => new Date(iso).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });
async function api(method, body) {
  const r = await fetch(AUTH_API + '/api/log', { method, body: body && JSON.stringify(body),
    headers: { authorization: 'Bearer ' + token, ...(body ? { 'content-type': 'application/json' } : {}) } });
  if (r.status === 401 || r.status === 403) { location.replace('./'); throw new Error('Signed out.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Could not save. Try again.');
  return j;
}
function draw() {
  const f = $('#filter').value;
  const rows = all.filter(e => !f || e.type === f).slice().reverse();
  $('#list').innerHTML = rows.length ? rows.map(e =>
    '<div class="entry"><div class="meta"><span class="pill pill--' + esc(e.type.split(' ')[0]) + '">' + esc(e.type) + '</span>'
    + '<span>#' + e.n + '</span><span>' + esc(fmt(e.when)) + '</span><span>' + esc(e.who) + '</span></div>'
    + '<div class="text">' + esc(e.text) + '</div></div>').join('')
    : '<p class="empty">' + (all.length ? 'Nothing of this type yet.' : 'No entries yet. Be the first.') + '</p>';
}
$('#filter').addEventListener('change', draw);
$('#f').addEventListener('submit', async e => {
  e.preventDefault(); $('#err').hidden = true; $('#ok').hidden = true;
  const btn = $('#f button'); btn.disabled = true;
  try {
    const j = await api('POST', { type: $('#type').value, text: $('#text').value });
    all.push(j.entry); $('#text').value = ''; $('#ok').hidden = false; draw();
  } catch (x) { $('#err').textContent = x.message; $('#err').hidden = false; }
  btn.disabled = false;
});
if (token) api('GET').then(j => { all = j; draw(); }).catch(x => { $('#list').innerHTML = '<p class="empty">' + esc(x.message) + '</p>'; });
</script>
</body>
</html>
